apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: coa-quality-matching-agent
  version: "1.0.0"

provides:
  apis:
    - name: coa-quality-matching-agent
      kind: a2a
      ordId: customer.build:apiResource:coa-quality-matching-71888.coa-quality-matching-agent:v1

container:
  buildPath: .
  port: 5000

requires:
  - name: sap-s4-inspection-lot-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:coa-quality-matching-71888.sap-s4-inspection-lot-mcp-server:v1
  - name: sap-s4-inspection-plan-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:coa-quality-matching-71888.sap-s4-inspection-plan-mcp-server:v1

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
